<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Braço Robótico VR + MQTT</title>
<style>
:root{--fg:#1c2230;--panel:rgba(255,255,255,.9);--acc:#e8590c}
@media (prefers-color-scheme:dark){:root{--fg:#e8ebf0;--panel:rgba(24,29,38,.9)}}
html,body{height:100%;margin:0;background:#171c26;color:var(--fg);font:13px system-ui,sans-serif;overflow:hidden}
#c{width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:absolute;left:8px;bottom:8px;width:250px;max-height:92%;overflow:auto;padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:0 2px 12px rgba(0,0,0,.3)}
h1{font-size:13px;margin:0 0 6px}
.r{display:grid;grid-template-columns:70px 1fr 36px;align-items:center;gap:6px;margin:3px 0}
.r output{text-align:right;opacity:.7}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;margin:2px 0;padding:4px;border-radius:6px;border:1px solid #8886;background:transparent;color:inherit}
.b{display:flex;gap:6px;margin:8px 0}
button{flex:1;padding:6px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.o{background:transparent;color:var(--fg);border:1px solid currentColor}
label{display:block;margin:3px 0}
details{margin-top:6px}summary{cursor:pointer;font-weight:600}
#st,#mq{font-size:11px;opacity:.85;margin-top:4px;min-height:1.2em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>🦾 Braço Robótico</h1>
  <div id="sl"></div>
  <div class="b"><button id="demo">▶ Demo</button><button id="rst" class="o">Reset</button></div>
  <details><summary>MQTT / ESP32</summary>
    <input id="url" type="text" placeholder="wss://broker:8884/mqtt">
    <input id="usr" type="text" placeholder="usuário">
    <input id="pwd" type="password" placeholder="senha">
    <input id="pfx" type="text" placeholder="prefixo do tópico (ex: braco)" value="braco">
    <label><input id="snd" type="checkbox"> Enviar comandos ao robô real</label>
    <label><input id="mir" type="checkbox"> Espelhar estado do robô real</label>
    <div class="b"><button id="con">Conectar</button></div>
    <div id="mq">desconectado</div>
  </details>
  <div id="st">Carregando modelo…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.30.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.30.0/babylonjs.loaders.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const B=BABYLON, K={"W": [0.3554, 0.0565, 0.18927], "S": [0.35292577566560457, 0.09682742678627118, 0.18292994423007594], "N": [0.68647, -1e-05, -0.72715], "El": [0.4023, 0.1847, 0.2383], "O3": [0.43602, 0.25325, 0.28705], "A": [0.48615, 0.74366, 0.45894], "E": [-0.82099, 0.5686, -0.0517], "P": [0.45147, 0.27709, 0.30396], "ng": [0.29645, 0.50191, 0.81252], "fA": [0.4701, 0.3233, 0.26879], "fB": [0.51506, 0.2866, 0.28552], "sA": 1, "sB": -1, "L1": 0.11500107055062504, "L2": 0.12355094738608846, "e0": 48.04413183184072, "roll0": 58.264463883196576, "sgn": -1, "g0e": 110.95215328077535, "phi0": 43.350858003566394, "sOff": -0.006151386717746927, "lat": 0.017449801656398336, "G4": {"A": {"P1": [0.03309964634698257, -0.013517420240429043], "P3": [0.0473674150091588, -0.03369378384312004], "Ld": 0.03232736577213505, "Ll": 0.033301384837220366, "Lf": 0.021840208904305707, "Lb": 0.02471143198653959, "th0": -0.14207976986576373, "ang0": -0.7774016230363681, "P2r": [0.06510126985635029, -0.018095047412894295], "P4r": [0.08066762805154899, -0.0334144213401305]}, "B": {"P1": [0.020832583762255552, -0.03996366676400866], "P3": [0.0422679038477658, -0.04285889724994292], "Ld": 0.03037954118094656, "Ll": 0.02995518705517801, "Lf": 0.022909162301274724, "Lb": 0.021629963169986263, "th0": -1.562067663679306, "ang0": -0.10621575446793324, "P2r": [0.02109775317561017, -0.07034205065036853], "P4r": [0.04387780878593841, -0.07277079183388313]}}};
const CFG={modelUrl:"braco.glb",humanReach:0.6,shoulderSide:0.17,shoulderDown:0.25,
           sendHz:20,smooth:0.25,pinchOn:0.03,gripOpenDist:0.09};
const $=id=>document.getElementById(id), say=t=>$("st").textContent=t;
window.addEventListener("error",e=>say("❌ Erro: "+e.message));
window.addEventListener("unhandledrejection",e=>say("❌ Erro: "+(e.reason&&e.reason.message||e.reason)));
const D2R=Math.PI/180, R2D=180/Math.PI, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// ---------- Estado das articulações (graus, relativos à pose do modelo) ----------
const J=[["waist","Cintura",-180,180],["shoulder","Ombro",-70,70],["elbow","Cotovelo",-120,120],
         ["pitch","Pulso",-80,80],["grip","Garra",0,30]];
const S={waist:0,shoulder:0,elbow:0,pitch:0,grip:0}; const inputs={};
let demo=false,t0=0,mode="manual"; // manual | mirror | hands
J.forEach(([k,l,mn,mx])=>{
  const d=document.createElement("div");d.className="r";
  d.innerHTML=`<span>${l}</span><input type="range" min="${mn}" max="${mx}" step="0.5" value="0"><output>0°</output>`;
  $("sl").appendChild(d);const i=d.querySelector("input"),o=d.querySelector("output");
  i.oninput=()=>{demo=false;$("demo").textContent="▶ Demo";S[k]=+i.value};inputs[k]=[i,o];
});
const syncUI=()=>J.forEach(([k])=>{inputs[k][0].value=S[k];inputs[k][1].textContent=Math.round(S[k])+"°"});
const clampS=()=>J.forEach(([k,,mn,mx])=>S[k]=clamp(S[k],mn,mx));
$("demo").onclick=()=>{demo=!demo;t0=performance.now()/1000;$("demo").textContent=demo?"⏸ Parar":"▶ Demo"};
$("rst").onclick=()=>{demo=false;$("demo").textContent="▶ Demo";J.forEach(([k])=>S[k]=0);syncUI()};

// ---------- Cinemática inversa (planar 2 elos + cintura + pulso) ----------
// dAxis: distância horizontal do eixo da cintura ao pulso (m do modelo); h: altura relativa ao ombro;
// phi: azimute atan2(z,x) do alvo (graus); eg: elevação desejada da garra (graus)
function solveArm(dAxis,h,phi,eg,K){
  const along=Math.sqrt(Math.max(dAxis*dAxis-K.lat*K.lat,1e-6));   // plano do braço fica K.lat ao lado do eixo
  const d=along-K.sOff, L1=K.L1, L2=K.L2;
  let r=Math.hypot(d,h); const ang=Math.atan2(h,d);
  r=clamp(r,Math.abs(L1-L2)+1e-3,L1+L2-1e-3);
  const a=Math.acos(clamp((r*r+L1*L1-L2*L2)/(2*r*L1),-1,1));
  const g=Math.acos(clamp((L1*L1+L2*L2-r*r)/(2*L1*L2),-1,1));
  const elev1=(ang+a)*R2D, el=(Math.PI-g)*R2D;
  const s=K.e0-elev1, psi=phi-Math.atan2(K.lat,along)*R2D;
  let w=K.phi0-psi; w=((w+540)%360)-180;
  const pitch=K.sgn*(K.g0e-s-el-eg);
  return {waist:w,shoulder:s,elbow:el,pitch:pitch};
}

// ---------- Esqueleto cinemático montado sobre as peças soltas do GLB ----------
function buildRig(scene,stage,K){
  const V=a=>new B.Vector3(a[0],a[1],a[2]);
  const part=n=>{const t=scene.getTransformNodeByName(n);if(!t)throw new Error("Peça não encontrada: "+n);return t};
  const mk=(name,pos,parent)=>{const n=new B.TransformNode(name,scene);n.parent=parent;n._p=V(pos);
    n.position=n._p.subtract(parent._p||B.Vector3.Zero());n.rotationQuaternion=B.Quaternion.Identity();return n};
  const J1=mk("j_waist",K.W,stage),J2=mk("j_shoulder",K.S,J1),J3=mk("j_elbow",K.El,J2),
        J4=mk("j_roll",K.O3,J3),J5=mk("j_pitch",K.P,J4);
  const q=(ax,deg)=>B.Quaternion.RotationAxis(V(ax).normalize(),deg*D2R);

  // ---- Garra: paralelogramo de 4 barras real (base→engrenagem/link→dedo), não um pivô único ----
  const ngV=V(K.ng).normalize();
  const aux=Math.abs(ngV.x)<0.9?new B.Vector3(1,0,0):new B.Vector3(0,1,0);
  const uV=B.Vector3.Cross(ngV,aux).normalize(), vV=B.Vector3.Cross(ngV,uV).normalize();
  const KP=V(K.P);
  const w3=p2=>KP.add(uV.scale(p2[0])).add(vV.scale(p2[1]));
  const mkSide=(tag,sign)=>{
    const g=K.G4[tag];
    return {g,sign,gear:mk("j_gear"+tag,w3(g.P1).asArray(),J5),link:mk("j_link"+tag,w3(g.P3).asArray(),J5),
            fing:mk("j_fing"+tag,w3(g.P2r).asArray(),J5)};
  };
  const sideA=mkSide('A',1), sideB=mkSide('B',-1);
  const map=[[J1,["Waist:1"]],[J2,["Arm 01:1"]],[J3,["Arm 02 v3:1"]],[J4,["Arm 03:1"]],[J5,["Gripper base:1"]],
    [sideA.gear,["gear2:1"]],[sideA.link,["grip link 1:2"]],[sideA.fing,["Gripper 1:1"]],
    [sideB.gear,["gear1:1"]],[sideB.link,["grip link 1:1"]],[sideB.fing,["Gripper 1 (1):1"]]];
  stage.computeWorldMatrix(true);
  [J1,J2,J3,J4,J5,sideA.gear,sideA.link,sideA.fing,sideB.gear,sideB.link,sideB.fing].forEach(n=>n.computeWorldMatrix(true));
  map.forEach(([p,ns])=>ns.forEach(n=>{const t=part(n);t.computeWorldMatrix(true);t.setParent(p)}));

  function solve2(g,dtheta){
    const P1=g.P1,P3=g.P3, th=g.th0+dtheta;
    const P2=[P1[0]+g.Ld*Math.cos(th), P1[1]+g.Ld*Math.sin(th)];
    const dx=P2[0]-P3[0],dy=P2[1]-P3[1]; let d=Math.hypot(dx,dy);
    d=Math.max(Math.abs(g.Ll-g.Lf)+1e-6,Math.min(g.Ll+g.Lf-1e-6,d));
    const a=(g.Ll*g.Ll-g.Lf*g.Lf+d*d)/(2*d), h=Math.sqrt(Math.max(g.Ll*g.Ll-a*a,0));
    const ux=dx/d,uy=dy/d, M=[P3[0]+a*ux,P3[1]+a*uy], px=-uy,py=ux;
    const c1=[M[0]+h*px,M[1]+h*py], c2=[M[0]-h*px,M[1]-h*py];
    const d1=(c1[0]-g.P4r[0])**2+(c1[1]-g.P4r[1])**2, d2=(c2[0]-g.P4r[0])**2+(c2[1]-g.P4r[1])**2;
    return {P2,P4:d1<d2?c1:c2};
  }
  function applySide(side,dtheta){
    const g=side.g, {P2,P4}=solve2(g,dtheta);
    side.gear.rotationQuaternion=q(ngV.asArray(),dtheta*R2D);
    const phi=Math.atan2(P4[1]-g.P3[1],P4[0]-g.P3[0])-Math.atan2(g.P4r[1]-g.P3[1],g.P4r[0]-g.P3[0]);
    side.link.rotationQuaternion=q(ngV.asArray(),phi*R2D);
    const rot=Math.atan2(P4[1]-P2[1],P4[0]-P2[0])-Math.atan2(g.P4r[1]-g.P2r[1],g.P4r[0]-g.P2r[0]);
    side.fing.position=w3(P2).subtract(J5._p);
    side.fing.rotationQuaternion=q(ngV.asArray(),rot*R2D);
  }

  return s=>{ // roll fixo = K.roll0 (endireita o eixo do pulso; o robô real tem 5 servos, sem roll)
    J1.rotationQuaternion=q([0,1,0],s.waist);J2.rotationQuaternion=q(K.N,s.shoulder);
    J3.rotationQuaternion=q(K.N,s.elbow);J4.rotationQuaternion=q(K.A,K.roll0);
    J5.rotationQuaternion=q(K.E,s.pitch);
    applySide(sideA,sideA.sign*s.grip*D2R);applySide(sideB,sideB.sign*s.grip*D2R);};
}

// ---------- MQTT ----------
let mq=null;
const cfgKeys=["url","usr","pwd","pfx"];
try{cfgKeys.forEach(k=>{const v=localStorage.getItem("braco_"+k);if(v!==null)$(k).value=v})}catch(e){}
$("con").onclick=()=>{
  try{cfgKeys.forEach(k=>localStorage.setItem("braco_"+k,$(k).value))}catch(e){}
  if(mq){mq.end(true);mq=null}
  const url=$("url").value.trim();if(!url){$("mq").textContent="informe a URL wss://";return}
  const pfx=$("pfx").value.trim()||"braco";
  $("mq").textContent="conectando…";
  mq=mqtt.connect(url,{username:$("usr").value||undefined,password:$("pwd").value||undefined,
    clientId:"vr-"+Math.random().toString(16).slice(2,8),reconnectPeriod:3000});
  mq.on("connect",()=>{$("mq").textContent="✔ conectado";mq.subscribe(pfx+"/estado")});
  mq.on("close",()=>$("mq").textContent="desconectado");
  mq.on("error",e=>$("mq").textContent="erro: "+e.message);
  mq.on("message",(_,m)=>{if(!$("mir").checked)return;
    try{const d=JSON.parse(m.toString());J.forEach(([k])=>{if(typeof d[k]==="number")S[k]=d[k]});mode="mirror"}catch(e){}});
};
$("mir").onchange=()=>{if($("mir").checked)$("snd").checked=false;else mode="manual"};
$("snd").onchange=()=>{if($("snd").checked)$("mir").checked=false;if(mode==="mirror")mode="manual"};
setInterval(()=>{
  if(!mq||!mq.connected||!$("snd").checked)return;
  const o={};J.forEach(([k])=>o[k]=Math.round(S[k]*10)/10);
  mq.publish(($("pfx").value.trim()||"braco")+"/cmd",JSON.stringify(o),{qos:0});
},1000/CFG.sendHz);

// ---------- Hand tracking → IK ----------
let handFeat=null,cam0=null,follow=false,tgt=null;
function handsStep(scene,xrCam,dt){
  if(!handFeat)return;
  const R=handFeat.getHandByHandedness("right"),L=handFeat.getHandByHandedness("left");
  const jp=(h,j)=>{const m=h&&h.getJointMesh(j);return m?m.getAbsolutePosition():null};
  const J_=B.WebXRHandJoint;
  const lt=L&&jp(L,J_.THUMB_TIP),li=L&&jp(L,J_.INDEX_FINGER_TIP);
  follow=!!(lt&&li&&B.Vector3.Distance(lt,li)<CFG.pinchOn);      // pinça da mão esquerda = habilita
  const w=jp(R,J_.WRIST),it=jp(R,J_.INDEX_FINGER_TIP),tt=jp(R,J_.THUMB_TIP);
  if(!w||!it||!tt||!follow)return;
  const head=xrCam.position, right=xrCam.getDirection(B.Vector3.Right());
  right.y=0;right.normalize();
  const sh=head.add(right.scale(CFG.shoulderSide)).add(new B.Vector3(0,-CFG.shoulderDown,0));
  const v=w.subtract(sh), f=(K.L1+K.L2)/CFG.humanReach;
  const dh=Math.hypot(v.x,v.z)*f, hh=v.y*f, phi=Math.atan2(v.z,v.x)*R2D;
  const dir=it.subtract(w), hl=Math.hypot(v.x,v.z)||1, eg=Math.atan2(dir.y,(dir.x*v.x+dir.z*v.z)/hl)*R2D; // elevação com sinal, relativa à direção ombro→mão
  const grip=30*clamp((B.Vector3.Distance(it,tt)-0.02)/(CFG.gripOpenDist-0.02),0,1);
  const a=solveArm(dh,hh,phi,eg,K); a.grip=grip;
  const k=1-Math.pow(1-CFG.smooth,dt*60);
  J.forEach(([n])=>{ // suavização exponencial; cintura respeita o caminho mais curto
    let dv=a[n]-S[n]; if(n==="waist")dv=((dv+540)%360)-180; S[n]+=dv*k;});
}

let pose=null,xrCamRef=null,inXR=false,sceneRef=null;
function tick(dt){
  if(!pose)return;
  if(demo){const t=performance.now()/1000-t0;
    S.waist=70*Math.sin(t*.5);S.shoulder=35*Math.sin(t*.8)+5;S.elbow=55*Math.sin(t*1.1+1);
    S.pitch=40*Math.sin(t*1.3);S.grip=15+15*Math.sin(t*2.2);}
  else if(inXR&&xrCamRef){handsStep(sceneRef,xrCamRef,dt)}
  clampS();pose(S);if(demo||inXR||mode==="mirror")syncUI();
}

(async()=>{
 try{
  const canvas=$("c"),engine=new B.Engine(canvas,true,{adaptToDeviceRatio:true});
  const scene=new B.Scene(engine);sceneRef=scene;scene.useRightHandedSystem=true;
  scene.clearColor=new B.Color4(.05,.06,.08,1);
  const cam=new B.ArcRotateCamera("cam",-Math.PI/2.6,1.15,2.6,new B.Vector3(0,1.15,-1.3),scene);
  cam.attachControl(canvas,true);cam.wheelPrecision=60;cam.lowerRadiusLimit=.6;cam.upperRadiusLimit=9;cam.minZ=.01;
  scene.createDefaultEnvironment({createSkybox:false,createGround:false});
  scene.fogMode=B.Scene.FOGMODE_LINEAR;scene.fogColor=new B.Color3(.55,.6,.66);scene.fogStart=6;scene.fogEnd=15;
  new B.HemisphericLight("h",new B.Vector3(0,1,0),scene).intensity=.75;
  const sun=new B.DirectionalLight("d",new B.Vector3(-.4,-1,.5),scene);sun.intensity=.9;

  // ---------- Laboratório de Mecatrônica (SENAI) — cenário procedural para imersão ----------
  const RW=11,RD=9,RH=4.2, roomZ=-1.3-RD/2+1.5;
  const flat=(c,e)=>{const m=new B.StandardMaterial("m"+Math.random(),scene);m.diffuseColor=c;m.specularColor=B.Color3.Black();if(e)m.emissiveColor=e;return m};
  const floorMat=new B.StandardMaterial("floor",scene);floorMat.diffuseColor=new B.Color3(.42,.46,.5);floorMat.specularColor=new B.Color3(.15,.15,.15);floorMat.specularPower=64;
  const floor=B.MeshBuilder.CreateGround("floor",{width:RW,height:RD},scene);floor.position.set(0,0,roomZ);floor.material=floorMat;
  const stripeMat=flat(new B.Color3(.85,.65,.05));
  [[-RW/2+.15,0],[RW/2-.15,0],[0,-RD/2+.15]].forEach(([x,zoff],i)=>{
    const s=B.MeshBuilder.CreateGround("safety"+i,{width:i<2?.3:RW,height:i<2?RD:.3},scene);
    s.position.set(x,.002,roomZ+zoff);s.material=stripeMat;});
  const wallHi=flat(new B.Color3(.86,.87,.89)), wallLo=flat(new B.Color3(.06,.16,.42));
  const mkWall=(w,h,x,y,z,ry)=>{const p=B.MeshBuilder.CreatePlane("w",{width:w,height:h},scene);p.position.set(x,y,z);p.rotation.y=ry;return p};
  mkWall(RW,RH,0,RH/2,roomZ-RD/2,0).material=wallHi;
  mkWall(RW,1.1,0,.55,roomZ-RD/2+.01,0).material=wallLo;
  mkWall(RD,RH,-RW/2,RH/2,roomZ,Math.PI/2).material=wallHi;
  mkWall(RD,1.1,-RW/2+.01,.55,roomZ,Math.PI/2).material=wallLo;
  mkWall(RD,RH,RW/2,RH/2,roomZ,-Math.PI/2).material=wallHi;
  mkWall(RD,1.1,RW/2-.01,.55,roomZ,-Math.PI/2).material=wallLo;
  const ceil=mkWall(RW,RD,0,RH,roomZ,Math.PI/2);ceil.rotation.set(Math.PI/2,0,0);ceil.material=flat(new B.Color3(.1,.11,.13));
  for(let i=-1;i<=1;i++){
    const l=B.MeshBuilder.CreatePlane("lum",{width:2.2,height:.35},scene);
    l.position.set(i*3,RH-.03,roomZ-RD/2+2.5);l.rotation.x=Math.PI/2;l.material=flat(new B.Color3(0,0,0),new B.Color3(.95,.97,1));
    const pl=new B.PointLight("pl"+i,l.position.add(new B.Vector3(0,-.3,0)),scene);pl.intensity=.5;pl.diffuse=new B.Color3(.95,.97,1);
  }
  const win=B.MeshBuilder.CreatePlane("win",{width:RD*.7,height:1.3},scene);win.position.set(RW/2-.02,2.6,roomZ);win.rotation.y=-Math.PI/2;
  win.material=flat(new B.Color3(0,0,0),new B.Color3(.65,.78,.95));
  const bannerTex=new B.DynamicTexture("banner",{width:1024,height:256},scene,true);
  const bc=bannerTex.getContext();bc.fillStyle="#ffffff";bc.fillRect(0,0,1024,256);
  bc.fillStyle="#e30613";bc.fillRect(0,0,1024,60);bc.fillStyle="#0b1f6e";bc.fillRect(0,196,1024,60);
  bc.fillStyle="#0b1f6e";bc.font="bold 108px Arial";bc.textAlign="center";bc.fillText("SENAI",512,150);
  bc.fillStyle="#444";bc.font="bold 40px Arial";bc.fillText("CURSO DE MECATRÔNICA",512,190);
  bannerTex.update();
  const bannerMat=new B.StandardMaterial("bm",scene);bannerMat.diffuseTexture=bannerTex;bannerMat.emissiveColor=new B.Color3(.5,.5,.5);bannerMat.specularColor=B.Color3.Black();
  const banner=B.MeshBuilder.CreatePlane("banner",{width:3.6,height:.9},scene);banner.position.set(0,2.9,roomZ-RD/2+.02);banner.material=bannerMat;
  const pegTex=new B.DynamicTexture("peg",{width:512,height:512},scene,true);const pc=pegTex.getContext();
  pc.fillStyle="#c9a24a";pc.fillRect(0,0,512,512);pc.strokeStyle="#00000055";pc.lineWidth=2;
  for(let x=20;x<512;x+=28)for(let y=20;y<512;y+=28){pc.beginPath();pc.arc(x,y,3,0,7);pc.stroke();}
  pc.fillStyle="#333";[[90,90,140,10],[260,70,16,120],[380,120,90,14],[150,260,110,10],[320,300,16,100]].forEach(([x,y,w,h])=>pc.fillRect(x,y,w,h));
  pegTex.update();
  const peg=B.MeshBuilder.CreatePlane("peg",{width:2.4,height:1.6},scene);peg.position.set(-3.2,1.8,roomZ-RD/2+.03);
  const pegMat=new B.StandardMaterial("pegm",scene);pegMat.diffuseTexture=pegTex;pegMat.specularColor=B.Color3.Black();peg.material=pegMat;
  const bench=B.MeshBuilder.CreateBox("bench",{width:2.4,height:.9,depth:.7},scene);bench.position.set(-3.2,.45,roomZ-RD/2+.6);
  bench.material=flat(new B.Color3(.75,.76,.78));
  const vise=B.MeshBuilder.CreateBox("vise",{width:.3,height:.22,depth:.35},scene);vise.position.set(-3.2,.95,roomZ-RD/2+.6);vise.material=flat(new B.Color3(.25,.27,.3));
  const shelf=B.MeshBuilder.CreateBox("shelf",{width:1.6,height:2.1,depth:.5},scene);shelf.position.set(3.6,1.05,roomZ-RD/2+.35);shelf.material=flat(new B.Color3(.5,.53,.57));
  const binCols=[new B.Color3(.85,.2,.15),new B.Color3(.1,.4,.8),new B.Color3(.95,.7,.1),new B.Color3(.2,.6,.3)];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const b=B.MeshBuilder.CreateBox("bin",{width:.42,height:.28,depth:.35},scene);
    b.position.set(3.6-.5+c*.5,.35+r*.62,roomZ-RD/2+.35);b.material=flat(binCols[(r*3+c)%binCols.length]);}
  const cnc=B.MeshBuilder.CreateBox("cnc",{width:1.3,height:1.5,depth:1.1},scene);cnc.position.set(4.2,.75,roomZ-1.4);cnc.material=flat(new B.Color3(.85,.4,.05));
  const cncTop=B.MeshBuilder.CreateBox("cncTop",{width:1.3,height:.5,depth:1.1},scene);cncTop.position.set(4.2,1.75,roomZ-1.4);cncTop.material=flat(new B.Color3(.15,.16,.18));

  const ped=B.MeshBuilder.CreateCylinder("ped",{diameter:1.1,height:.7,tessellation:48},scene);
  ped.position.set(0,.35,-1.3);const pm=new B.StandardMaterial("pm",scene);pm.diffuseColor=new B.Color3(.55,.57,.62);ped.material=pm;
  window.addEventListener("resize",()=>engine.resize());
  let last=performance.now();
  engine.runRenderLoop(()=>{const n=performance.now();tick(Math.min(.05,(n-last)/1000));last=n;scene.render()});

  try{ // B) modelo (arquivo braco.glb ao lado do index.html)
    const res=await B.SceneLoader.ImportMeshAsync("","./",CFG.modelUrl,scene);
    const root=res.meshes[0],vm=res.meshes.filter(m=>m.getTotalVertices()>0);vm.forEach(m=>m.computeWorldMatrix(true));
    const {min,max}=B.Mesh.MinMax(vm),sz=max.subtract(min),k=1/Math.max(sz.x,sz.y,sz.z);
    const stage=new B.TransformNode("stage",scene);stage.scaling.setAll(k);
    stage.position.set(0-k*K.W[0],.7-k*min.y,-1.3-k*K.W[2]);root.parent=stage;
    pose=buildRig(scene,stage,K);
    say("✔ Arraste para orbitar. Sliders, ▶ Demo, ou entre em VR (mãos).");
  }catch(e){console.error(e);say("❌ Modelo (precisa de HTTP/HTTPS, não file://): "+(e.message||e));return}

  try{ // C) WebXR isolado
    const xr=await scene.createDefaultXRExperienceAsync({uiOptions:{sessionMode:"immersive-vr"},optionalFeatures:true});
    xrCamRef=xr.baseExperience.camera;
    try{handFeat=xr.baseExperience.featuresManager.enableFeature(B.WebXRFeatureName.HAND_TRACKING,"latest",
      {xrInput:xr.input,disableDefaultHandMesh:true,jointMeshes:{enablePhysics:false}})}catch(e){console.warn("hand tracking",e)}
    xr.baseExperience.onStateChangedObservable.add(s=>{
      inXR=s===B.WebXRState.IN_XR;$("ui").style.display=inXR?"none":"";if(inXR){demo=false;mode="hands"}else if(mode==="hands")mode="manual"});
    say("✔ Pronto. Botão 🥽 para VR. Em VR: mão direita move o robô; PINÇA da mão esquerda = habilita.");
  }catch(e){say("⚠️ VR indisponível (precisa de HTTPS + navegador WebXR). A pré-visualização 3D funciona.")}
 }catch(err){console.error(err);say("❌ Erro: "+(err.message||err))}
})();
</script>
</body>
